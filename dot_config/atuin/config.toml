# Local-only by default. Run `atuin register` / `atuin login` to enable sync.
auto_sync = false
update_check = false

search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "directory"
style = "compact"
inline_height = 14
enter_accept = false
show_preview = true
show_help = false
show_tabs = false

# Keep secrets out of history.
secrets_filter = true
history_filter = [
  "^ls$",
  "^c$",
  "^clear$",
]

[theme]
name = "catppuccin-macchiato-mauve"
