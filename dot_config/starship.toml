"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_macchiato"

# Only the modules listed here are shown.
format = """
$directory$git_branch$git_state$git_status$cmd_duration
$character"""

add_newline = true

[palettes.catppuccin_macchiato]
mauve = "#c6a0f6"
red = "#ed8796"
green = "#a6da95"
sapphire = "#7dc4e4"
yellow = "#eed49f"
overlay0 = "#6e738d"

[directory]
style = "bold sapphire"
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = "\ue0a0 "
style = "bold mauve"
format = "[on](overlay0) [$symbol$branch]($style) "

[git_status]
style = "red"
format = '([\[$all_status$ahead_behind\]]($style) )'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[git_state]
style = "yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[cmd_duration]
min_time = 3000
style = "yellow"
format = "[took $duration]($style)"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
